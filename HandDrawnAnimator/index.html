<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hand-Drawn Animator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="device">
  <div class="panel">

    <i class="screw s-tl"></i><i class="screw s-tr"></i>
    <i class="screw s-bl"></i><i class="screw s-br"></i>

    <header class="brand">
      <div class="logo">
        <span class="logo-script">Hand&nbsp;Drawn</span>
        <span class="logo-bold">ANIMATOR</span>
      </div>
      <span class="version">V 1.0</span>
    </header>

    <div class="console">

      <!-- LEFT: ANIMATION preset knob -->
      <section class="bay bay-left">
        <i class="screw s-bay tl"></i><i class="screw s-bay tr"></i>
        <div class="bay-head">
          <span>ANIMATION</span>
          <span class="readout" id="animReadout">Normal</span>
        </div>
        <div class="knob-row">
          <button class="arrow-btn" id="animPrev" title="Previous preset">&#9664;</button>
          <div class="knob" id="knob" title="Turn to change animation preset">
            <div class="knob-rim">
              <div class="knob-face">
                <svg class="scribble" viewBox="0 0 100 100" aria-hidden="true">
                  <path d="M30 64 C18 50 38 30 52 40 C66 50 44 70 36 56 C30 46 56 28 70 38 C82 47 60 72 48 60"
                        fill="none" stroke="#f4f1ea" stroke-width="4"
                        stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
          </div>
          <button class="arrow-btn" id="animNext" title="Next preset">&#9654;</button>
        </div>
      </section>

      <!-- CENTER: text + style -->
      <section class="bay bay-center">
        <i class="screw s-bay tl"></i><i class="screw s-bay tr"></i>
        <div class="display-row">
          <input type="text" class="text-input" id="textInput" placeholder="TEXT HERE" maxlength="120" spellcheck="false">
          <button class="dropper" id="refresh" title="Re-check timeline selection">&#10227;</button>
        </div>
        <div class="bay-head center"><span>STYLE</span></div>
        <div class="selector-row">
          <button class="arrow-btn" id="stylePrev">&#9664;</button>
          <div class="selector" id="styleLabel">None</div>
          <button class="arrow-btn" id="styleNext">&#9654;</button>
        </div>
      </section>

      <!-- RIGHT: TRANSITION (Animate In / Out) -->
      <section class="bay bay-right">
        <i class="screw s-bay tl"></i><i class="screw s-bay tr"></i>
        <div class="bay-head"><span>TRANSITION</span></div>
        <div class="subpanels">

          <div class="subpanel" data-trans="in">
            <div class="sub-head"><span>Animate In</span><span class="readout dir-readout">None</span></div>
            <div class="dpad">
              <button class="dbtn up"    data-dir="up">&#9650;</button>
              <button class="dbtn left"  data-dir="left">&#9664;</button>
              <button class="dbtn none on" data-dir="none" title="No animation">&#9863;</button>
              <button class="dbtn right" data-dir="right">&#9654;</button>
              <button class="dbtn down"  data-dir="down">&#9660;</button>
            </div>
          </div>

          <div class="subpanel" data-trans="out">
            <div class="sub-head"><span>Animate Out</span><span class="readout dir-readout">None</span></div>
            <div class="dpad">
              <button class="dbtn up"    data-dir="up">&#9650;</button>
              <button class="dbtn left"  data-dir="left">&#9664;</button>
              <button class="dbtn none on" data-dir="none" title="No animation">&#9863;</button>
              <button class="dbtn right" data-dir="right">&#9654;</button>
              <button class="dbtn down"  data-dir="down">&#9660;</button>
            </div>
          </div>

        </div>
      </section>

    </div>

    <button class="animate-btn" id="apply">ANIMATE</button>
    <pre id="log" class="log" hidden></pre>
    <div id="status" class="statusline">Connecting&hellip;</div>
  </div>
</div>

  <script src="lib/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
