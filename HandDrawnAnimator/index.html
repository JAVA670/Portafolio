<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hand-Drawn Animator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="device">
  <div class="panel">

    <!-- corner screws -->
    <i class="screw s-tl"></i><i class="screw s-tr"></i>
    <i class="screw s-bl"></i><i class="screw s-br"></i>

    <!-- brand -->
    <header class="brand">
      <div class="logo">
        <span class="logo-script">Hand&nbsp;Drawn</span>
        <span class="logo-bold">ANIMATOR</span>
      </div>
      <span class="version">V 1.0</span>
    </header>

    <!-- main console -->
    <div class="console">

      <!-- LEFT: intensity knob -->
      <section class="bay bay-left">
        <i class="screw s-bay tl"></i><i class="screw s-bay tr"></i>
        <div class="bay-head">
          <span>INTENSITY</span>
          <span class="readout" id="intensityReadout">Med</span>
        </div>
        <div class="knob-row">
          <button class="arrow-btn" id="jitterDown" title="Less jitter">&#9664;</button>
          <div class="knob" id="knob" title="Drag to set Jitter Intensity">
            <div class="knob-rim">
              <div class="knob-face">
                <svg class="scribble" viewBox="0 0 100 100" aria-hidden="true">
                  <path d="M30 64 C18 50 38 30 52 40 C66 50 44 70 36 56 C30 46 56 28 70 38 C82 47 60 72 48 60"
                        fill="none" stroke="#f4f1ea" stroke-width="4"
                        stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
            <span class="knob-value" id="jitterValue">40</span>
          </div>
          <button class="arrow-btn" id="jitterUp" title="More jitter">&#9654;</button>
        </div>
      </section>

      <!-- CENTER: status display + style selector -->
      <section class="bay bay-center">
        <i class="screw s-bay tl"></i><i class="screw s-bay tr"></i>
        <div class="display-row">
          <div class="display" id="status">Connecting&hellip;</div>
          <button class="dropper" id="refresh" title="Re-check timeline selection">&#10227;</button>
        </div>
        <div class="bay-head center"><span>STYLE</span></div>
        <div class="selector-row">
          <button class="arrow-btn" id="stylePrev">&#9664;</button>
          <div class="selector" id="styleLabel">Random Boil</div>
          <button class="arrow-btn" id="styleNext">&#9654;</button>
        </div>
      </section>

      <!-- RIGHT: output options -->
      <section class="bay bay-right">
        <i class="screw s-bay tl"></i><i class="screw s-bay tr"></i>
        <div class="bay-head"><span>OUTPUT</span></div>
        <div class="subpanels">
          <div class="subpanel">
            <div class="sub-head"><span>Boil Rate</span></div>
            <div class="rate-toggle" id="rateToggle">
              <button data-fps="8">8 fps</button>
              <button data-fps="12" class="on">12 fps</button>
            </div>
          </div>
          <div class="subpanel">
            <div class="sub-head"><span>Extras</span></div>
            <button class="mini" id="mogrt" title="Insert AE-look boil MOGRT above the clip">MOGRT</button>
            <button class="mini" id="find" title="List effect names in this Premiere build">Effects</button>
          </div>
        </div>
      </section>

    </div>

    <!-- action -->
    <button class="animate-btn" id="apply">ANIMATE</button>

    <pre id="log" class="log" hidden></pre>
  </div>
</div>

  <script src="lib/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
